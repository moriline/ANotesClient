      summary: Загрузить вложение страницы вики
      description: |
        Принимает один файл. Возвращает метаданные вместе с готовым url,
        который вставляется в Markdown страницы как ![подпись](url).
        Ограничения на размер, число вложений на странице и разрешённые типы —
        в конфигурации сервера; SVG не поддерживается. Тип определяется по
        содержимому файла, а не по расширению или заявленному Content-Type.
        Нужно право task:update. Агенту недоступно.
      parameters:
      - name: pageId
        in: path
        required: true
        schema:
          format: int32
          type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
