  /api/projects/{projectId}/roadmap:
    get:
      tags:
      - Roadmap Resource
      summary: Роадмап проекта
      description: |
        Временная шкала эпиков: одна полоса — один эпик, от startDate до
        dueDate, заливка по childDone/childTotal. Даты эпика приоритетны;
        если их нет — выводятся по задачам (MIN start/created, MAX due),
        флаг datesInferred. Эпики без дат вообще — в undated, не прячутся.
        from/to (ГГГГ-ММ-ДД) задают край шкалы; без них — по эпикам ± неделя.
        state (NOT_STARTED|IN_PROGRESS|DONE|AT_RISK|OVERDUE) и childOverdue
        считаются на сервере. Виден участнику проекта; свыше предела эпиков — 400.
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          format: int32
          type: integer
      - name: from
        in: query
        schema:
          type: string
      - name: to
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadmapResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
