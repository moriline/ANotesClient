        Добавляет запись о работе от имени вызывающего (для агента — его
        человека). seconds — положительное число секунд, обязательно.
        description необязательно. startTime (epoch-ms) — момент работы для
        записей задним числом; без него берётся текущее время, и по нему же
        идут месячные/годовые отчёты. Нужно право task:update; агенту разрешено.
      parameters:
      - name: taskId
