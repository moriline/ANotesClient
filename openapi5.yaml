# TaskMind API — OpenAPI 3.0.3
#
# СГЕНЕРИРОВАНО из аннотаций ресурсов (quarkus-smallrye-openapi), не править руками.
# Живая версия отдаётся приложением на /q/openapi (?format=yaml), Swagger UI — /q/swagger-ui.
# Обновить этот снимок:
#   mvn clean package -DskipTests
#   java -jar target/quarkus-app/quarkus-run.jar        # затем
#   curl -s "http://localhost:8080/q/openapi?format=yaml" -o openapi5.yaml
#
# Заменяет openAPI.yaml, openapi2.yaml, openapi3.yaml и openapi4.yaml: те писались
# руками, расходились с кодом и между собой (см. коммит).
---
openapi: 3.0.3
info:
  title: TaskMind API
  description: REST API менеджера задач и базы знаний ANotes/TaskMind
  version: 5.0.0
paths:
  /api/admin/users:
    get:
      tags:
      - Admin User Resource
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUserResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/admin/users/{id}:
    delete:
      tags:
      - Admin User Resource
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: int32
          type: integer
      responses:
        "200":
          description: OK
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/admin/users/{id}/status:
    put:
      tags:
      - Admin User Resource
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: int32
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserStatusRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/agent/openapi.json:
    get:
      tags:
      - Agent Open Api Resource
      summary: OpenAPI для ИИ-агента
      description: |
        Подмножество основной спеки — операции, доступные агенту: поиск задач,
        чтение и правка задачи, комментарии, резюме, списание времени, статусы
        проекта, список проектов, эпики проекта, вики (дерево, страница,
        поиск, список вложений страницы). Скормите этот документ модели как
        набор инструментов вместо полного /q/openapi.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/auth/agent-token:
    post:
      tags:
      - Auth Resource
      summary: Выпустить токен для ИИ-агента
      description: |
        Возвращает второй JWT для того же пользователя: sub тот же, группы
        USER+AGENT без ADMIN, срок 48 часов. Агент под ним читает и меняет
        задачи в проектах пользователя, но не удаляет и не управляет
        доступом — на попытку приходит 403 с пояснением.
        В журнале активности значится человек, а не «Агент».
        Рефреша нет: по истечении — снова этот запрос обычным токеном.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/auth/login:
    post:
      tags:
      - Auth Resource
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/register:
    post:
      tags:
      - Auth Resource
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/comments/{commentId}:
    put:
      tags:
      - Comment Resource
      parameters:
      - name: commentId
        in: path
        required: true
        schema:
          format: int32
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
    delete:
      tags:
      - Comment Resource
      parameters:
      - name: commentId
        in: path
        required: true
        schema:
          format: int32
          type: integer
      responses:
        "200":
          description: OK
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/epics/{epicId}/tasks:
    get:
      tags:
      - Epic Resource
      summary: Задачи эпика
      description: |
        Дочерние задачи эпика в порядке создания. 404 — нет такого эпика или
        нет доступа к его проекту; 400 — id принадлежит обычной задаче, а не
        эпику.
      parameters:
      - name: epicId
        in: path
        required: true
        schema:
          format: int32
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/files/download/{fileName}:
    get:
      tags:
      - File Resource
      parameters:
      - name: fileName
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/files/projects/{projectId}/tasks/{taskId}:
    post:
      tags:
      - File Resource
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          format: int32
          type: integer
      - name: taskId
        in: path
        required: true
        schema:
          format: int32
          type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  $ref: "#/components/schemas/FileUpload"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/files/tasks/{taskId}:
    get:
      tags:
      - File Resource
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          format: int32
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/files/{fileId}:
    delete:
      tags:
      - File Resource
      parameters:
      - name: fileId
        in: path
        required: true
        schema:
          format: int32
          type: integer
      responses:
        "200":
          description: OK
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/find:
    post:
      tags:
      - Find Resource
      summary: Найти задачи
      description: |
        Поиск задач в проектах, доступных вызывающему (свои + где он участник).
        Все поля тела необязательны и комбинируются по И:
          titleSearch   — подстрока в заголовке;
          contentSearch — подстрока в описании, резюме и обсуждении задачи
                          (так находятся прежние выводы агента);
          projectId     — ограничить одним проектом (чужой → пустой результат);
          assignedUserId / assignedToMe — по исполнителю (assignedToMe не
                          возвращает эпики — у них нет исполнителя);
          statusId      — по статусу (id из GET /api/project-statuses/project/{projectId});
          taskType      — EPIC | TASK (не задан — оба);
          parentId      — задачи конкретного эпика;
          isArchived    — true/false;
          grouped       — true: всё незакрытое одного проекта разом + все его
                          эпики, без пагинации (для вида «по эпикам»);
                          требует projectId, иначе 400; свыше порога задач — 400;
          sortBy        — createdAt|updatedAt|dueDate|title, sortDir — asc|desc;
          limit (≤200, по умолчанию 50), offset.
        В ответе: tasks[] (каждая с projectId, statusId, assignedUserId, version)
        и total — сколько подходит всего, помимо текущей страницы.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindTasksRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseWrapper"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/milestones/{id}:
    get:
      tags:
      - Milestone Resource
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: int32
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
    put:
      tags:
      - Milestone Resource
      summary: Изменить веху
      description: |
        Частичная правка: title, description, dueDate. Поле null — не трогать.
        state не меняется — для этого /close и /reopen. Необязательный заголовок
        X-Expected-Version: с устаревшим значением — 409. Нужно право task:update.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: int32
          type: integer
      - name: X-Expected-Version
        in: header
        schema:
          format: int32
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
    delete:
      tags:
      - Milestone Resource
      summary: Удалить веху
      description: |
        Задач нет — 204. Задачи есть без параметра — 409 с их числом.
        ?tasks=detach — задачам ставится milestoneId=null; ?tasks=move&to={id}
        — задачи переносятся в другую (открытую, того же проекта) веху.
        Задачи НЕ удаляются ни при каком варианте. Нужно право task:delete.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: int32
          type: integer
      - name: tasks
        in: query
        schema:
          type: string
      - name: to
        in: query
        schema:
          format: int32
          type: integer
      responses:
        "200":
          description: OK
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/milestones/{id}/close:
    put:
      tags:
      - Milestone Resource
      summary: Закрыть веху
      description: |
        Закрытие с незавершёнными задачами разрешено (релиз выпускают и с
        недоделанными пунктами) — но событие пишется в журнал отдельным типом
        MILESTONE_CLOSED_INCOMPLETE. Повторное закрытие — 400. Нужно право task:update.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: int32
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/milestones/{id}/reopen:
    put:
      tags:
      - Milestone Resource
      summary: Открыть веху заново
      description: Повторное открытие — 400. Нужно право task:update.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: int32
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/milestones/{id}/tasks:
    get:
      tags:
      - Milestone Resource
      summary: Задачи вехи
      description: "Задачи, привязанные к вехе. У каждой parentId — из какого она\
        \ эпика (веха собирает работу из разных эпиков)."
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: int32
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/notifications:
    get:
      tags:
      - Notification Resource
      summary: Мои уведомления
      description: "Лента колокольчика, новые сверху. unread=true — только непрочи\
        танные."
      parameters:
      - name: limit
        in: query
        schema:
          format: int32
          type: integer
      - name: unread
        in: query
        schema:
          type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/notifications/count:
    get:
      tags:
      - Notification Resource
      summary: Число непрочитанных
      description: "Одно число для значка на колокольчике: { \"unread\": 3 }."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCountResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/notifications/read-all:
    put:
      tags:
      - Notification Resource
      summary: Отметить все прочитанными
      responses:
        "200":
          description: OK
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/notifications/settings:
    get:
      tags:
      - Notification Resource
      summary: Настройки уведомлений
      description: По строке на каждый тип события с действующим значением переключателя
        in-app.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationSettingResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/notifications/settings/{type}:
    put:
      tags:
      - Notification Resource
      summary: Включить/выключить тип уведомлений
      description: "Выключенный тип не создаёт записей вовсе. type: MENTION | ASSIGNED\
        \ | COMMENT | STATUS_CHANGED."
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettingRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationSettingResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/notifications/{id}/read:
    put:
      tags:
      - Notification Resource
      summary: Отметить уведомление прочитанным
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: int32
          type: integer
      responses:
        "200":
          description: OK
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/permissions/check:
    post:
      tags:
      - Permission Resource
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionCheckRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/project-statuses:
    post:
      tags:
      - Project Status Resource
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectStatusRequest"
      responses:
        "200":
          description: OK
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/project-statuses/project/{projectId}:
    get:
      tags:
      - Project Status Resource
      summary: Статусы проекта
      description: |
        Допустимые статусы задач этого проекта, по порядку на доске, с id,
        названием, флагами isDefault и isClosed. Вызывать перед сменой
        статуса задачи: в PATCH /api/projects/{projectId}/tasks/{taskId}
        идёт statusId именно отсюда, чужой статус → 400.
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          format: int32
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectStatusResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/project-statuses/{statusId}:
    put:
      tags:
      - Project Status Resource
      parameters:
      - name: statusId
        in: path
        required: true
        schema:
          format: int32
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectStatusUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStatusResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/projects:
    get:
      tags:
      - Project Resource
      summary: Проекты пользователя
      description: |
        Проекты, доступные вызывающему: свои плюс те, где он участник.
        Агент видит ровно тот же список, что его человек. У каждого проекта
        есть id — он нужен для GET /api/project-statuses/project/{id} и для
        путей задач /api/projects/{projectId}/tasks/...
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
    post:
      tags:
      - Project Resource
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRequest"
      responses:
        "200":
          description: OK
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/projects/appearance:
    get:
      tags:
      - Project Appearance Resource
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAppearanceResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
  /api/projects/{id}:
    get:
      tags:
      - Project Resource
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: int32
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
    delete:
      tags:
      - Project Resource
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: int32
          type: integer
      responses:
        "200":
          description: OK
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
    patch:
      tags:
      - Project Resource
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: int32
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
