  /api/projects/{projectId}/tasks/{taskId}:
    get:
      tags:
      - Task Resource
      summary: Получить задачу по номеру
      description: |
        Возвращает задачу целиком: заголовок, описание, статус (statusId),
        исполнителя (assignedUserId), теги, сроки, оценку, суммарное списанное
        время и version (нужен для X-Expected-Version при PATCH).
        Комментарии не входят — их отдаёт GET /api/tasks/{taskId}/comments,
        резюме — GET /api/tasks/{taskId}/summary.
        projectId и taskId есть в каждом элементе ответа POST /api/find.
      parameters:
      - name: projectId
        in: path
        description: id проекта задачи (поле projectId из результата /api/find)
        required: true
        schema:
          format: int32
          type: integer
      - name: taskId
        in: path
        required: true
        schema:
          format: int32
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
    delete:
      tags:
      - Task Resource
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          format: int32
          type: integer
      - name: taskId
        in: path
        required: true
        schema:
          format: int32
          type: integer
      - name: children
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
    patch:
      tags:
      - Task Resource
      summary: Изменить задачу
      description: |
        Частичное обновление: любое подмножество полей title, description,
        tags, assignedUserId, statusId, dueDate, startDate (epoch-ms),
        estimatedHours, isArchived. Поле, которого нет в теле, не меняется.
        Смена статуса: statusId берётся из GET /api/project-statuses/project/{projectId};
        чужой статус или исполнитель не из проекта → 400.
        Нужно право task:update. Агенту это разрешено; удаление задачи (DELETE)
        агенту запрещено — вернётся 403.
        Заголовок X-Expected-Version = version из прочитанной карточки: если
        задачу тем временем изменили, придёт 409 вместо перезаписи. Каждый
        успешный PATCH увеличивает version на 1.
      parameters:
      - name: projectId
        in: path
        description: id проекта задачи (поле projectId из результата /api/find)
        required: true
        schema:
          format: int32
          type: integer
      - name: taskId
        in: path
        required: true
        schema:
          format: int32
          type: integer
      - name: X-Expected-Version
        in: header
        description: "version задачи, прочитанный перед правкой; при расхождении —\
          \ 409"
        schema:
          format: int32
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - bearerAuth: []
